name: Build & Release Cross-Platform App

on:
  push:
    branches:
      - production

jobs:
  build-and-release:
    name: Build All Platforms & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Clean Previous Builds
        run: flutter clean

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Linux Bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
          cd build/linux/x64/release/bundle
          zip -r ../../../../../mandarin_app-linux-x64.zip .
          cd -

      - name: Set Release Tag
        id: tag
        run: |
          echo "TAG_NAME=v1.0.$(date +'\%Y\%m\%d\%H\%M\%S')" >> $GITHUB_ENV

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body: |
            Aplikasi Mandarin Learning otomatis di-build dari branch main.
            
            **File Instalasi:**
            - `app-release.apk`: Khusus HP Android
            - `mandarin_app-linux-x64.zip`: Khusus Linux Desktop
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            mandarin_app-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}