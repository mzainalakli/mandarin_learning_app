name: Build & Release Cross-Platform App

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-android:
    name: Build Linux & Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Accept Android Licenses and Install SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Clean Previous Builds
        run: flutter clean

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing. Refusing to build with the debug key."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # Previous builds all had versionCode 1, so offset by 10 to always be higher.
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=$((10 + ${{ github.run_number }}))

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/36.0.0/apksigner)
          OUT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          if echo "$OUT" | grep -q "Android Debug"; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Remove signing files
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Build Linux Bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/mandarin_app-linux-x64.zip" .

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandarin_app-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandarin_app-linux-x64
          path: mandarin_app-linux-x64.zip
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "mandarin_app-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandarin_app-windows-x64
          path: mandarin_app-windows-x64.zip
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set Release Tag
        run: echo "TAG_NAME=v1.0.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          target_commitish: ${{ github.sha }}
          body: |
            Aplikasi Mandarin Learning otomatis di-build dari branch production.

            **File Instalasi:**
            - `app-release.apk`: Android
            - `mandarin_app-linux-x64.zip`: Linux Desktop
            - `mandarin_app-windows-x64.zip`: Windows Desktop
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/mandarin_app-linux-x64.zip
            dist/mandarin_app-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
